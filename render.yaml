# DEMO EXCLUSIVAMENTE: no utilizar con información real de estudiantes.
services:
  - type: web
    name: kawsay-ai-demo
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./render.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////srv/data/kawsay.db
      - key: AI_PROVIDER
        value: disabled
      - key: CORS_ORIGINS
        value: ""
      - key: JWT_SECRET
        sync: false
