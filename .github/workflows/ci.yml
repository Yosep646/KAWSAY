name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./data/ci.db
      JWT_SECRET: ci_only_jwt_secret_ci_only_jwt_secret_1234
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt -r ../ml/requirements.txt bandit pip-audit
      - run: alembic upgrade head && alembic downgrade base && alembic upgrade head   # migraciones reversibles
      - run: pytest -q
      - run: ruff check .
      - run: mypy app
      - run: bandit -q -r app -ll
      - run: pip-audit -r requirements.txt
      - run: cd .. && python -m pytest ml/tests -q
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: teacher-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.15.0, cache: npm, cache-dependency-path: teacher-web/package-lock.json }
      - run: npm ci
      - run: npm run preflight
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: 24.15.0, cache: npm, cache-dependency-path: teacher-web/package-lock.json }
      - run: python -m pip install -r backend/requirements-dev.txt -r ml/requirements.txt
      - run: npm ci
        working-directory: teacher-web
      - run: npx playwright install --with-deps chromium
        working-directory: teacher-web
      - name: Exercise real backend/frontend inputs and outputs in Chrome
        run: python scripts/browser_e2e.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-e2e-artifacts
          path: teacher-web/test-results
          if-no-files-found: ignore
