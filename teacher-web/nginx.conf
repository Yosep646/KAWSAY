server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://backend:8000; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Forwarded-For $remote_addr; }
  location / { try_files $uri /index.html; }   # SPA
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;
}
